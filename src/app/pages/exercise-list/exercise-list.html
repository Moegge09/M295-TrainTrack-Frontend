<main class="wrapper">

  <mat-card>
    <mat-card-header>
      <mat-card-title>Übungen</mat-card-title>
    </mat-card-header>

    @if (loading()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <mat-card-content>

      @if (error()) {

        <p class="error">
          <mat-icon color="warn">error_outline</mat-icon>
          {{ error() }}
        </p>

      } @else if (exercises().length === 0 && !loading()) {

        <p>Noch keine Übungen erfasst.</p>

      } @else {

        <table mat-table [dataSource]="exercises()">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let exercise">{{ exercise.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let exercise">{{ exercise.name }}</td>
          </ng-container>

          <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef>Gewicht (kg)</th>
            <td mat-cell *matCellDef="let exercise">{{ exercise.weight }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let exercise">
              <!-- Directive blendet den Button aus, wenn die Rolle update fehlt -->
              <span *appIsInRoles="[roles.Update]">
                <button mat-icon-button
                        [routerLink]="['/exercise', exercise.id]"
                        aria-label="Übung bearbeiten">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button
                        (click)="deleteExercise(exercise)"
                        aria-label="Übung löschen">
                  <mat-icon>delete</mat-icon>
                </button>
              </span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

      }

    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="load()" [disabled]="loading()">
        <mat-icon>refresh</mat-icon>
        Neu laden
      </button>

      <button mat-flat-button routerLink="/exercise/new" *appIsInRoles="[roles.Update]">
        <mat-icon>add</mat-icon>
        Neue Übung
      </button>
    </mat-card-actions>

  </mat-card>

</main>
