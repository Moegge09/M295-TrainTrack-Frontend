<main class="wrapper">

  <mat-card>
    <mat-card-header>
      <mat-card-title>Gyms</mat-card-title>
    </mat-card-header>

    @if (loading()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <mat-card-content>

      @if (error()) {

        <p class="error">
          <mat-icon color="warn">error_outline</mat-icon>
          {{ error() }}
        </p>

      } @else if (gyms().length === 0 && !loading()) {

        <p>Noch keine Gyms erfasst.</p>

      } @else {

        <table mat-table [dataSource]="gyms()">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let gym">{{ gym.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let gym">{{ gym.name }}</td>
          </ng-container>

          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef>Adresse</th>
            <td mat-cell *matCellDef="let gym">{{ formatAddress(gym) }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let gym">
              <span *appIsInRoles="[roles.Admin]">
                <button mat-icon-button
                        [routerLink]="['/gym', gym.id]"
                        aria-label="Gym bearbeiten">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button
                        (click)="deleteGym(gym)"
                        aria-label="Gym löschen">
                  <mat-icon>delete</mat-icon>
                </button>
              </span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

      }

    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="load()" [disabled]="loading()">
        <mat-icon>refresh</mat-icon>
        Neu laden
      </button>

      <button mat-flat-button routerLink="/gym/new" *appIsInRoles="[roles.Admin]">
        <mat-icon>add</mat-icon>
        Neues Gym
      </button>
    </mat-card-actions>

  </mat-card>

</main>
