<main class="wrapper">

  <mat-card>
    <mat-card-header>
      <mat-card-title>Pläne</mat-card-title>
    </mat-card-header>

    @if (loading()) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <mat-card-content>

      @if (error()) {

        <p class="error">
          <mat-icon color="warn">error_outline</mat-icon>
          {{ error() }}
        </p>

      } @else if (plans().length === 0 && !loading()) {

        <p>Noch keine Pläne erfasst.</p>

      } @else {

        <table mat-table [dataSource]="plans()">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let plan">{{ plan.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let plan">{{ plan.name }}</td>
          </ng-container>

          <ng-container matColumnDef="trainings">
            <th mat-header-cell *matHeaderCellDef>Trainings</th>
            <td mat-cell *matCellDef="let plan">{{ trainingNames(plan) }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let plan">
              <span *appIsInRoles="[roles.Admin]">
                <button mat-icon-button
                        [routerLink]="['/plan', plan.id]"
                        aria-label="Plan bearbeiten">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button
                        (click)="deletePlan(plan)"
                        aria-label="Plan löschen">
                  <mat-icon>delete</mat-icon>
                </button>
              </span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        </table>

      }

    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="load()" [disabled]="loading()">
        <mat-icon>refresh</mat-icon>
        Neu laden
      </button>

      <button mat-flat-button routerLink="/plan/new" *appIsInRoles="[roles.Admin]">
        <mat-icon>add</mat-icon>
        Neuer Plan
      </button>
    </mat-card-actions>

  </mat-card>

</main>
